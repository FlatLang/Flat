name: Flat-Compiler / Test Flat-Compiler

on:
  workflow_dispatch:
    inputs:
      seed_manifest:
        description: "Absolute seed manifest path supplied by approved runner-image delivery; not provisioned by this workflow"
        required: true
        type: string
      review_receipt:
        description: "Absolute independently reviewed provenance receipt path"
        required: true
        type: string
      review_sha256:
        description: "Independent SHA-256 of the review receipt"
        required: true
        type: string
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "0 8 * * *"

env:
  LOGGING_DEFAULT_SHOW_PREFIX: true
  LOGGING_DEFAULT_LOGGING_LEVEL: DEBUG
  LOGGING_DEFAULT_SHOW_FORMATTING: true

jobs:
  # Manual acceptance only until immutable seed delivery is approved/provisioned.
  # Inputs identify delivered files; they do not fetch or manufacture a trust root.
  # Normal CI runs harness unit tests, NOT full self-host acceptance. Hosted runner
  # inputs unavailable on disk fail immediately, never skip a dispatched gate.
  stage-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Execute reviewed offline stage0/1/2 acceptance
        shell: bash
        env:
          SEEDS: ${{ inputs.seed_manifest }}
          REVIEW: ${{ inputs.review_receipt }}
          REVIEW_SHA256: ${{ inputs.review_sha256 }}
        run: |
          set -euo pipefail
          test -n "$SEEDS" && test -f "$SEEDS" || { echo 'Missing reviewed seed provisioning (no approved delivery source configured)' >&2; exit 1; }
          test -n "$REVIEW" && test -f "$REVIEW" || { echo 'Missing seed provenance review receipt' >&2; exit 1; }
          test -n "$REVIEW_SHA256" || { echo 'Missing independently approved review digest' >&2; exit 1; }
          python3 -B packages/Airship/test/stage_bootstrap.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/flat-stages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --seeds "$SEEDS" --review "$REVIEW" --review-sha256 "$REVIEW_SHA256"

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.8.0
        with:
          java-version: 8

      - uses: actions/checkout@v4

      - name: Download latest Airship
        uses: ./.github/actions/download-airship
        with:
          repo: ${{ github.repository }}
          includePrerelease: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test isolated bootstrap harness (not self-host acceptance)
        run: python3 -B -m unittest discover -s packages/Airship/test -p test_stage_bootstrap.py

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Link monorepo packages for Airship
        uses: ./.github/actions/setup-flat-monorepo
        with:
          # The package acceptance test needs a separately bootstrapped flatc.
          # Keep the Java bootstrap until Flat-written self-hosting is proven.
          prebuild-targets: es6 flatc

      - name: Bootstrap production Airship for package acceptance
        run: |
          node airship.js --use-links -f packages/Airship install --flatc-runtime java -t es6
          test -s packages/Airship/dist/airship.js
          test -s packages/Flat-Compiler/dist/es6/index.js

      - name: Build Flat-Compiler Test
        run: |
          node airship.js --use-links -f packages/Flat-Compiler install test -t es6

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test.js
          path: packages/Flat-Compiler/dist/es6/test.js

      - name: Run Flat-Compiler Test
        run: |
          node airship.js --use-links -f packages/Flat-Compiler run test
